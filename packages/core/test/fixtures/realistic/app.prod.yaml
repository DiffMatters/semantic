# Production configuration. Intentional differences from app.staging.yaml / app.base.json:
#   changed:       environment, version, server.tls, server.read_timeout_ms,
#                  database.host/password/pool.max, redis.url, logging.level,
#                  features.new_checkout, services[payments].timeout_ms + url,
#                  integrations.stripe.*, integrations.sentry.sample_rate,
#                  scale.min_replicas/max_replicas
#   type changed:  server.port (number -> string "8080"), database.pool.min (2 -> "2"),
#                  features.dark_mode (null -> false), maintenance_window ("" -> null)
#   removed:       logging.file, features.beta_search, services[notifications],
#                  redis.ttl_s, legacy.setting, allowed_ips[1]
#   added:         server.cors.max_age_s, database.read_replicas, features.ai_recs,
#                  services[search], scale.autoscale
#   reordered:     server.cors.allowed_origins (same set), services (inventory first)
#   array shrink:  logging.sinks (file removed)
app_name: orders-service
version: "1.11.0"
environment: production
release_date: "2024-03-01"

server:
  host: 0.0.0.0
  port: "8080"
  tls: true
  read_timeout_ms: 15000
  max_body_bytes: 10485760
  cors:
    enabled: true
    allowed_origins:
      - https://admin.example.com
      - https://app.example.com
    allowed_methods: [GET, POST, PUT, DELETE]
    max_age_s: 86400

database:
  driver: postgres
  host: db-primary.prod.internal
  port: 5432
  name: orders
  user: orders_rw
  password: "Pr0d-P@ssw0rd!"
  ssl_mode: require
  pool:
    min: "2"
    max: 50
    idle_timeout_s: 300
  read_replicas:
    - db-replica-1.prod.internal
    - db-replica-2.prod.internal

redis:
  url: rediss://cache.prod.internal:6380/0

logging:
  level: info
  format: json
  sinks:
    - stdout

features:
  new_checkout: false
  dark_mode: false
  ai_recs: true

rate_limits:
  default: { requests: 100, window_s: 60 }
  per_ip: { requests: 1000, window_s: 3600 }

services:
  - name: inventory
    url: https://inventory.prod.internal
    timeout_ms: 2000
    retries: 1
  - name: payments
    url: https://payments.prod.internal
    timeout_ms: 8000
    retries: 3
  - name: search
    url: https://search.prod.internal
    timeout_ms: 1500
    retries: 2

integrations:
  stripe:
    api_key: sk-live-FAKE-KEY-FOR-TESTS-ONLY
    webhook_secret: whsec_yyyyyyyyyyyyyyyy
  sentry:
    dsn: https://abc123@o0.ingest.sentry.io/0
    sample_rate: 0.05

maintenance_window: null
tags: []
metadata: {}
allowed_ips:
  - 10.0.0.0/8

scale:
  cpu_limit: 1.5
  memory_mb: 512
  min_replicas: 3
  max_replicas: 20
  scale_factor: 1000
  autoscale: true

greeting: "Hello, 世界 — ünïcödé ✓"
file_mode: "0755"
zip_code: "02134"
notes: "line one\nline two\n"
